<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Vape Market | Барахолка для вейпов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Наши стили -->
    <link rel="stylesheet" href="css/styles.css">
    
    <style>
        /* Дополнительные стили для бейджа админа (если нет в styles.css) */
        .admin-badge {
            position: absolute;
            top: 12px;
            right: 15px;
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .admin-badge.show {
            display: flex;
        }
        .admin-badge i {
            font-size: 12px;
        }
        .app-header {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Шапка с бейджем администратора -->
        <div class="app-header">
            <div class="logo">
                <i class="fas fa-vape"></i>
                <span>Vape Market</span>
            </div>
            <!-- Бейдж администратора -->
            <div class="admin-badge">
                <i class="fas fa-shield-alt"></i> ADMIN
            </div>
        </div>

        <!-- Контент -->
        <div class="main-content">
            <!-- Страница Главная (лента объявлений) -->
            <div id="homePage" class="page active">
                <!-- Здесь будет динамически подгружаться контент -->
            </div>

            <!-- Страница Личный кабинет -->
            <div id="profilePage" class="page">
                <!-- Динамический контент профиля -->
            </div>

            <!-- Страница FAQ -->
            <div id="faqPage" class="page">
                <div class="faq-list">
                    <div class="faq-item">
                        <div class="faq-question">
                            Как создать объявление?
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="faq-answer" style="display: none;">
                            Нажмите на кнопку "+" внизу экрана, заполните форму и опубликуйте объявление.
                        </div>
                    </div>
                    <div class="faq-item">
                        <div class="faq-question">
                            Как связаться с продавцом?
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="faq-answer" style="display: none;">
                            Нажмите кнопку "Написать продавцу" на карточке товара.
                        </div>
                    </div>
                    <div class="faq-item">
                        <div class="faq-question">
                            Как пожаловаться на объявление?
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="faq-answer" style="display: none;">
                            В карточке объявления нажмите кнопку "Пожаловаться".
                        </div>
                    </div>
                </div>
            </div>

            <!-- Страница Админ-панель -->
            <div id="adminPage" class="page">
                <!-- Динамический контент админки -->
            </div>
        </div>

        <!-- Нижнее меню навигации -->
        <div class="bottom-nav">
            <button class="nav-item active" data-page="home">
                <i class="fas fa-home nav-icon"></i>
                <span class="nav-label">Главная</span>
            </button>
            <button class="nav-item" data-page="profile">
                <i class="fas fa-user nav-icon"></i>
                <span class="nav-label">Профиль</span>
            </button>
            <button class="nav-item" data-page="faq">
                <i class="fas fa-question-circle nav-icon"></i>
                <span class="nav-label">FAQ</span>
            </button>
            <button class="nav-item admin-only" data-page="admin" style="display: none;">
                <i class="fas fa-shield-alt nav-icon"></i>
                <span class="nav-label">Админ</span>
            </button>
        </div>
    </div>

    <!-- Модальное окно для фото -->
    <div id="photoModal" class="photo-modal">
        <div class="photo-modal-close">×</div>
        <img class="photo-modal-img" alt="Просмотр фото">
        <div class="photo-modal-counter"></div>
        <div class="photo-modal-nav">
            <button class="photo-modal-nav-btn prev">‹</button>
            <button class="photo-modal-nav-btn next">›</button>
        </div>
    </div>

    <!-- Скрипты (ваши существующие файлы) -->
    <script src="js/supabase.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Дополнительная инициализация для фото (фикс проблемы с отображением)
        document.addEventListener('DOMContentLoaded', function() {
            // Функция для открытия галереи (если не определена в ui.js)
            if (typeof window.openPhotoGallery !== 'function') {
                window.openPhotoGallery = function(photos, currentIndex) {
                    const modal = document.getElementById('photoModal');
                    const img = modal.querySelector('.photo-modal-img');
                    const counter = modal.querySelector('.photo-modal-counter');
                    const prevBtn = modal.querySelector('.prev');
                    const nextBtn = modal.querySelector('.next');
                    
                    window.currentGalleryPhotos = photos;
                    window.currentGalleryIndex = currentIndex;
                    
                    function updatePhoto() {
                        img.src = window.currentGalleryPhotos[window.currentGalleryIndex];
                        counter.textContent = `${window.currentGalleryIndex + 1} / ${window.currentGalleryPhotos.length}`;
                    }
                    
                    updatePhoto();
                    modal.classList.add('active');
                    
                    // Навигация
                    const newPrev = prevBtn.cloneNode(true);
                    const newNext = nextBtn.cloneNode(true);
                    prevBtn.parentNode.replaceChild(newPrev, prevBtn);
                    nextBtn.parentNode.replaceChild(newNext, nextBtn);
                    
                    newPrev.onclick = function(e) {
                        e.stopPropagation();
                        if (window.currentGalleryIndex > 0) {
                            window.currentGalleryIndex--;
                            updatePhoto();
                        }
                    };
                    
                    newNext.onclick = function(e) {
                        e.stopPropagation();
                        if (window.currentGalleryIndex < window.currentGalleryPhotos.length - 1) {
                            window.currentGalleryIndex++;
                            updatePhoto();
                        }
                    };
                };
            }
            
            // Закрытие галереи
            const modal = document.getElementById('photoModal');
            const closeBtn = document.querySelector('.photo-modal-close');
            if (closeBtn) {
                closeBtn.onclick = function() {
                    modal.classList.remove('active');
                };
            }
            if (modal) {
                modal.onclick = function(e) {
                    if (e.target === modal) {
                        modal.classList.remove('active');
                    }
                };
            }
        });
    </script>
</body>
</html>
